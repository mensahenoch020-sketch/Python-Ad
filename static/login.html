<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Console — Sign in</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="login-body">
  <main class="login-card">
    <h1>Remote Administration Console</h1>
    <p class="muted">Educational tool — authorised use only.</p>

    <!-- Shows when ?error=1 is in the URL after a bad password. -->
    <p id="error" class="error" hidden>Incorrect password.</p>

    <form method="post" action="/login">
      <label for="password">Operator password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             autofocus required />
      <button type="submit">Sign in</button>
    </form>

    <p class="muted small">
      The operator password is separate from the agent shared secret. Both are
      required for control.
    </p>
  </main>

  <script>
    // Reveal the error message if the server redirected with ?error=1.
    if (new URLSearchParams(location.search).has("error")) {
      document.getElementById("error").hidden = false;
    }
  </script>
</body>
</html>
